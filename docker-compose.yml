
services:
  backend:
    image: maven:3.9-eclipse-temurin-17
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend-data:/app/data
    command: mvn spring-boot:run
    ports:
      - "8080:8080"

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

  worker:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./worker:/app
    command: sh -c "pip install -r requirements.txt && python -m app.main"
    depends_on:
      - backend

volumes:
  backend-data:
  frontend-modules:
